[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generation library"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]
[tool.mypy]
disable_error_code = ["type-arg"]